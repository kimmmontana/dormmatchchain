<div class="auth-field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ field.label }}{% if not field.field.required %} <span class="text-muted fw-normal">(optional)</span>{% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
    {% endfor %}
    {% if show_help and field.help_text %}
    <div class="form-text auth-help">{{ field.help_text|safe }}</div>
    {% endif %}
</div>
